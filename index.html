<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Instagram 連携コードの受け取り</title>
<style>
  :root {
    --bg: #f6f7f9;
    --card: #ffffff;
    --text: #1c1e21;
    --muted: #65676b;
    --line: #dcdfe3;
    --accent: #0a66c2;
    --ok: #1a7f37;
    --warn: #b42318;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px 16px 48px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans",
                 "Noto Sans JP", "Yu Gothic", sans-serif;
    line-height: 1.7;
    -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 620px; margin: 0 auto; }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 24px 20px;
    margin-bottom: 16px;
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 14px; margin: 0 0 20px; }
  .label { font-size: 14px; color: var(--muted); margin-bottom: 8px; }
  #code {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 17px;
    word-break: break-all;
    background: #f0f2f5;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 16px;
    user-select: all;
    -webkit-user-select: all;
  }
  button {
    width: 100%;
    margin-top: 14px;
    padding: 15px 16px;
    font-size: 16px;
    font-weight: 600;
    color: #fff;
    background: var(--accent);
    border: 0;
    border-radius: 8px;
    cursor: pointer;
  }
  button:active { opacity: .85; }
  .done { background: var(--ok); }
  .steps { margin: 16px 0 0; padding-left: 1.2em; font-size: 15px; }
  .steps li { margin-bottom: 6px; }
  .note { font-size: 13px; color: var(--muted); margin-top: 18px; }
  .err h1 { color: var(--warn); }
  .hide { display: none; }
</style>
</head>
<body>
<div class="wrap">

  <div class="card" id="ok-card">
    <h1>連携コードを受け取りました</h1>
    <p class="sub">下のコードをコピーして、担当者へ送信してください。</p>

    <div class="label">連携コード</div>
    <div id="code">読み込み中…</div>
    <button id="copy" type="button">コードをコピーする</button>

    <ol class="steps">
      <li>上のボタンでコードをコピー</li>
      <li>ChatWork の担当者宛に貼り付けて送信</li>
      <li>この画面は閉じていただいて構いません</li>
    </ol>

    <p class="note">
      このコードは短時間で無効になります。お手数ですが、そのままお送りください。<br>
      コードはこの画面に表示しているだけで、どこにも保存・送信していません。
    </p>
  </div>

  <div class="card err hide" id="err-card">
    <h1>連携が完了しませんでした</h1>
    <p class="sub" id="err-msg"></p>
    <p class="note">
      お手数ですが、担当者からお送りしたリンクをもう一度お開きください。<br>
      同じ画面が出る場合は、この画面のまま担当者へご連絡ください。
    </p>
  </div>

</div>

<script>
(function () {
  var q = new URLSearchParams(window.location.search);
  var code = q.get("code");
  var err = q.get("error") || q.get("error_type");
  var errDesc = q.get("error_description") || q.get("error_reason") || "";

  var okCard = document.getElementById("ok-card");
  var errCard = document.getElementById("err-card");

  if (!code) {
    okCard.classList.add("hide");
    errCard.classList.remove("hide");
    document.getElementById("err-msg").textContent =
      err ? ("理由：" + err + (errDesc ? "（" + errDesc + "）" : ""))
          : "連携コードが見つかりませんでした。";
    return;
  }

  var el = document.getElementById("code");
  el.textContent = code;

  document.getElementById("copy").addEventListener("click", function () {
    var btn = this;
    var done = function () {
      btn.textContent = "コピーしました";
      btn.classList.add("done");
      setTimeout(function () {
        btn.textContent = "コードをコピーする";
        btn.classList.remove("done");
      }, 2500);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(code).then(done, fallback);
    } else {
      fallback();
    }
    function fallback() {
      var r = document.createRange();
      r.selectNodeContents(el);
      var s = window.getSelection();
      s.removeAllRanges();
      s.addRange(r);
      try { document.execCommand("copy"); done(); } catch (e) {
        btn.textContent = "コードを長押しして選択・コピーしてください";
      }
    }
  });
})();
</script>
</body>
</html>
